# XcodeGen spec for the Mac app.
#   brew install xcodegen && cd app/macos && xcodegen generate
#   open KnowledgePress.xcodeproj
#
# `swift run KnowledgePress` from app/GutenbergKGKit still works and is still
# the fastest loop. This target exists for the things a SwiftPM executable
# cannot be: a signed, sandboxed bundle, archived for the Mac App Store, which
# is the only way the app reaches anyone else.
name: KnowledgePress
options:
  bundleIdPrefix: com.fluxfrontiers
  # 26.0, for the reason app/ios/project.yml gives: the on-device answer
  # engine is macOS 26 and Private Cloud Compute 27, so on 14 or 15 the app
  # installs and cannot write an answer. The store listing says macOS 26.
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  GutenbergKGKit:
    path: ../GutenbergKGKit

targets:
  KnowledgePress:
    type: application
    platform: macOS
    # The same file the SwiftPM executable builds -- one macOS shell, two
    # wrappers around it. Duplicating it here would let the .app and
    # `swift run` drift apart silently, which is exactly the bug this app
    # cannot afford: they must answer identically.
    sources:
      - path: ../GutenbergKGKit/Sources/KnowledgePress
        name: Sources
      # See app/ios/project.yml — generated, but committed.
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      # See app/ios/project.yml: a folder reference, so the corpus keeps its
      # layout inside Contents/Resources. Empty in development and in CI;
      # `make mac-stage-corpus` fills it, and `make mac-archive` stages first.
      - path: Corpus
        type: folder
    dependencies:
      - package: GutenbergKGKit
        product: KnowledgePressUI
    # Private Cloud Compute, same entitlement as app/ios/project.yml and the
    # same App ID, which holds the capability since 2026-09-14. A restricted
    # entitlement has to be in the provisioning profile as well as the
    # signature, so `make mac-dev` (automatic signing, Apple Development) is
    # the local path that gets PCC on a Mac, and the Mac App Store profile
    # `make mac-archive` uses grants it too. Apple's Developer ID profile does
    # not, which is one reason there is no notarized Developer ID build.
    #
    # App Sandbox is required on the Mac App Store, and lives here rather than
    # in an archive-only file so `make mac-dev` runs sandboxed too: a sandbox
    # failure shows up in the dev build instead of in TestFlight, since an
    # App Store-signed app cannot be run locally. network.client is the
    # outgoing connection to the LAN worker. files.user-selected.read-write
    # lets the Save panel write exports and illustrations where the reader
    # picks; the Mac share menu has no save-to-disk item.
    entitlements:
      path: KnowledgePress.entitlements
      properties:
        com.apple.developer.private-cloud-compute: true
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Knowledge Press
        # Both from the build settings below, so the Makefile can set the build
        # number (git commit count) at build time.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # See app/ios/project.yml: spares every upload the by-hand
        # export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        LSMinimumSystemVersion: "26.0"
        # Required on the Mac App Store: an upload without it is rejected at
        # validation. Books, matching docs/APP_STORE_LISTING.md.
        LSApplicationCategoryType: public.app-category.books
        NSHumanReadableCopyright: "© 2026 Eric G. Suchanek, PhD. Elastic-2.0."
        # The worker is reachable over plain HTTP on the LAN, same as iOS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # macOS 15 and later ask before an app reaches the local network, as
        # iOS does, and show this text in the prompt.
        NSLocalNetworkUsageDescription:
          The Knowledge Press connects to the GutenbergKG worker running on a
          Mac on your network to retrieve passages. Answers are written on
          this Mac.
    # Same reason as app/ios/project.yml: without a shared scheme xcodebuild
    # invents one spanning every target in the workspace.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluxfrontiers.knowledgepress
        # The release version; scripts/check_version.py fails when it
        # disagrees with web/package.json or the other version sites.
        MARKETING_VERSION: "1.31.0"
        # Overridden by the Makefile with `git rev-list --count HEAD`.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The sandboxed builds (mac-dev, the App Store archive) keep
        # Application Support in
        # ~/Library/Containers/com.fluxfrontiers.knowledgepress; `swift run`
        # uses ~/Library/Application Support/Corpus. An installed corpus wins
        # over the bundled one. No code change either way, since
        # CorpusPacks.defaultDirectory() resolves through FileManager.
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: ""
      configs:
        # Xcode injects com.apple.security.get-task-allow -- the entitlement
        # that lets a debugger attach -- into every signature unless told not
        # to. A shipping build has no business carrying it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
