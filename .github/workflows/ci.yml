name: CI

# Repo-wide checks: the pre-commit hooks, including the version-site check.
# Building and testing the code is app.yml's and web.yml's job; they are
# path-filtered, so this is the one workflow every change runs. The web hooks
# are skipped here because web.yml runs the same typecheck and tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run pre-commit on every file
        env:
          SKIP: web-typecheck,web-test
        run: pipx run pre-commit run --all-files --show-diff-on-failure
